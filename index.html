<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KikoBim Imóveis - Sistema Conectado</title>
    
    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Adicionando Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos Modulares -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/kanban.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-gold mb-4"></div>
        <p class="text-gold font-serif text-xl animate-pulse">Carregando KikoBim...</p>
        <p class="text-xs text-slate-500 mt-2">Conectando ao banco de dados</p>
    </div>

    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between shadow-md z-20 h-18 shrink-0">
        <div class="flex items-center gap-4">
            <div class="relative group cursor-pointer" onclick="window.location.reload()">
                <div class="flex items-baseline gap-1">
                    <i data-lucide="home" class="text-gold w-8 h-8 fill-current stroke-slate-900 stroke-2"></i>
                    <div class="flex flex-col">
                        <h1 class="font-serif font-bold text-2xl text-gold leading-none tracking-tight">
                            KB <span class="text-white font-sans font-light">KikoBim</span>
                        </h1>
                        <span class="text-[10px] text-gold-light opacity-80 uppercase tracking-[0.2em] font-medium ml-1">Imóveis</span>
                    </div>
                </div>
            </div>
            <div class="h-8 w-[1px] bg-slate-700 hidden sm:block mx-2"></div>
            <div class="hidden sm:block">
                <p id="page-title" class="text-xs text-slate-400 font-medium">Gestão de Leads</p>
            </div>
        </div>

        <div id="search-container" class="flex-1 max-w-md mx-6 relative group hidden md:block transition-opacity duration-300">
            <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 w-4 h-4"></i>
            <input 
                type="text" 
                id="search-input"
                placeholder="Buscar lead por nome..."
                class="w-full pl-10 pr-4 py-2 bg-slate-800 border border-slate-700 rounded-full text-sm text-slate-200 placeholder-slate-500 focus:ring-2 ring-gold focus:bg-slate-800 focus:border-transparent transition-all shadow-inner outline-none"
            />
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-3 cursor-pointer hover:bg-slate-800 p-1.5 rounded-full pr-3 transition-colors group">
                 <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-yellow-500 to-yellow-700 ring-2 ring-slate-700 shadow-md flex items-center justify-center text-slate-900 font-bold text-xs">JS</div>
                 <div class="hidden lg:block text-left">
                   <p class="text-xs font-bold text-slate-200 leading-none">João Silva</p>
                   <p class="text-[10px] text-slate-500 leading-none mt-1 text-gold">Online</p>
                 </div>
            </div>
        </div>
    </header>

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col min-w-0 overflow-hidden relative bg-slate-100"></div>

    <!-- BOTTOM NAV -->
    <nav class="bg-white border-t border-slate-200 px-2 pb-safe pt-2 flex justify-around items-center shrink-0 z-30 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] h-20 sm:h-auto">
        <div class="flex w-full max-w-lg justify-between items-center mx-auto">
            <button onclick="App.changeView('kanban')" id="nav-kanban" class="flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-xl group text-slate-900">
                <div class="p-1.5 rounded-full mb-1 bg-gold-light text-gold-dark icon-container">
                    <i data-lucide="layout" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium font-bold label-text">Pipeline</span>
            </button>

            <button onclick="App.changeView('dashboard')" id="nav-dashboard" class="flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-xl group text-slate-400">
                <div class="p-1.5 rounded-full mb-1 icon-container">
                    <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium label-text">Métricas</span>
            </button>

            <div class="relative -top-6">
                 <button onclick="Modal.openAddLead()" class="bg-gold text-white p-4 rounded-full shadow-lg hover-bg-gold transform hover:scale-105 transition-all ring-4 ring-slate-50 flex items-center justify-center">
                   <i data-lucide="plus" class="w-7 h-7"></i>
                 </button>
            </div>

            <button class="flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-xl text-slate-400">
                <div class="p-1.5 rounded-full mb-1"><i data-lucide="users" class="w-5 h-5"></i></div>
                <span class="text-[10px] font-medium">Equipe</span>
            </button>

            <!-- Botão Clientes (Substituindo Alertas) -->
            <button onclick="App.changeView('clients')" id="nav-clients" class="flex-1 flex flex-col items-center justify-center py-2 px-1 rounded-xl text-slate-400 group">
                <div class="p-1.5 rounded-full mb-1 icon-container">
                    <i data-lucide="book-user" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium label-text">Clientes</span>
            </button>
        </div>
    </nav>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed bottom-24 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MODAL LAYERS -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"></div>
    <div id="add-lead-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4"></div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/kanban.js"></script>
    <script src="js/dashboard.js"></script>
    <!-- Incluindo novo script de Clientes -->
    <script src="js/clients.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
